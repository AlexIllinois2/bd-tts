# 构建要求 JDK 17（AGP 8.13.2 / Kotlin 2.3.10 / compileOptions VERSION_17）。
# 本机 java -> /usr/lib/jvm/java-17-temurin-jdk (17.0.20)，而 PATH 里的 javac 是 25；
# Gradle 用 JVM 内置 compiler，不受 PATH javac 影响；如需在 shell 里手动用 javac 先执行：
#   export JAVA_HOME=/usr/lib/jvm/java-17-temurin-jdk
# 跨平台工程不在此写死 org.gradle.java.home，避免 Windows 机器读到 Linux 绝对路径。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
