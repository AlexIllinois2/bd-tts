plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.midu.tts'
    // Compose BOM 2025.10.00 / activity-compose 1.11.0 需要 36；本机 SDK 已装 android-36。
    compileSdk 36

    // 与已安装的 SDK 组件对齐。
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.midu.tts"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2.0"

        // 本包只有 arm64-v8a 的厂商库闭包（见 README §0）。
        ndk { abiFilters 'arm64-v8a' }

        buildConfigField "String", "UPSTREAM_RULE_URL", "\"https://raw.githubusercontent.com/AlexIllinois2/midu_unified_rule/main/conf/unified_rule.txt\""
        buildConfigField "String", "UPSTREAM_PATCH_URL", "\"https://raw.githubusercontent.com/AlexIllinois2/midu_unified_rule/main/conf/rule_patch.txt\""
        buildConfigField "int", "DEFAULT_HTTP_PORT", "8765"
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
        compose true
    }

    sourceSets {
        main {
            // Kotlin 插件默认就会带 src/main/kotlin，这里显式声明避免不同 AGP 版本行为差异。
            java.srcDirs += 'src/main/kotlin'
        }
    }

    // 必须由 PackageManager 把 .so 解压到 nativeLibraryDir：桥接层用绝对路径 dlopen。
    packagingOptions {
        jniLibs {
            // Groovy DSL 官方写法（Kotlin DSL 才用 `= true`）；AGP 8 也可用 `packaging {}`
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // ---- Shizuku / Sui：以 shell(2000) 或 root(0) 身份读 MultiTTS 的 Android/data 语音包。
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    // SAF 目录（用户自选离线语音位置）。
    implementation "androidx.documentfile:documentfile:1.0.1"

    // ---- Jetpack Compose + Material 3（M3 Expressive 风格）
    def composeBom = platform('androidx.compose:compose-bom:2025.10.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.foundation:foundation'
    // Compose 1.9 起图标不再由 material3 传递，必须显式引；BOM 管版本。
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    // 显式钉 1.4.0：Expressive 组件（SegmentedButton / LoadingIndicator 等）在这一代落地。
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.core:core-ktx:1.17.0'
}
